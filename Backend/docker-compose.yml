services:
  user_management:
    build:
      context: ./user-management
      dockerfile: Dockerfile
    container_name: user_management
    hostname: user_management
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /app/data/user_management.db
      MAILER_URL: https://mailer:3000
      ENABLE_HTTPS: "true"
      CERT_PATH: /app/certs
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/transcendence-ca.crt
    volumes:
      - user_data:/app/data
      - ./certs/ca/ca.crt:/usr/local/share/ca-certificates/transcendence-ca.crt:ro
      - ./certs/services/user-management:/app/certs:ro
    ports:
      - "3001:3000"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get('https://localhost:3000/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.transcendence.service=user-management"
      - "com.transcendence.tier=core"

  socket_microservice:
    build:
      context: ./socket-microservice
      dockerfile: Dockerfile
    container_name: socket_microservice
    hostname: socket_microservice
    environment:
      NODE_ENV: production
      PORT: 3005
      USER_SERVICE_URL: https://user_management:3000
      AUTH_JWT_SECRET: dev-gateway-secret
      HEARTBEAT_MS: 15000
      ENABLE_HTTPS: "true"
      CERT_PATH: /app/certs
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/transcendence-ca.crt
    volumes:
      - ./certs/ca/ca.crt:/usr/local/share/ca-certificates/transcendence-ca.crt:ro
      - ./certs/services/socket-microservice:/app/certs:ro
    ports:
      - "3005:3005"
    networks:
      - backend
    depends_on:
      user_management:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get('https://localhost:3005/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.transcendence.service=socket"
      - "com.transcendence.tier=realtime"

  game_microservice:
    build:
      context: ./game-microservice
      dockerfile: Dockerfile
    container_name: game_microservice
    hostname: game_microservice
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /app/data/game_management.db
      ENABLE_HTTPS: "true"
      CERT_PATH: /app/certs
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/transcendence-ca.crt
    volumes:
      - game_data:/app/data
      - ./certs/ca/ca.crt:/usr/local/share/ca-certificates/transcendence-ca.crt:ro
      - ./certs/services/game-microservice:/app/certs:ro
    ports:
      - "3004:3000"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get('https://localhost:3000/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.transcendence.service=game"
      - "com.transcendence.tier=core"

  mailer:
    build:
      context: ./mailer-microservice
      dockerfile: Dockerfile
    container_name: mailer
    hostname: mailer
    environment:
      NODE_ENV: production
      PORT: 3000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: 42transcender@gmail.com
      SMTP_PASS: jrlrgyfofocmliou
      FROM_EMAIL: 42transcender@gmail.com
      FROM_NAME: Transcender
      ENABLE_HTTPS: "true"
      CERT_PATH: /app/certs
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/transcendence-ca.crt
    volumes:
      - ./certs/ca/ca.crt:/usr/local/share/ca-certificates/transcendence-ca.crt:ro
      - ./certs/services/mailer-microservice:/app/certs:ro

      - "com.transcendence.tier=communication"

  session_microservice:
    build:
      context: ./session-microservice
      dockerfile: Dockerfile
    container_name: session_microservice
    hostname: session_microservice
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /app/data/session.db
      ENABLE_HTTPS: "true"
      CERT_PATH: /app/certs

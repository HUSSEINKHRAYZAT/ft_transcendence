      context: ./google-oauth2
      dockerfile: Dockerfile
    container_name: google_oauth2
    hostname: google_oauth2
    environment:
      NODE_ENV: production
      PORT: 3000
      GOOGLE_CLIENT_ID: 710484980381-ruekfrc3otecdgpq44tms9ifgfff7fij.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      GOOGLE_REDIRECT_URI: https://localhost:8080/authWithGoogle/callback
      USER_SERVICE_URL: https://user_management:3000
      AUTH_JWT_SECRET: dev-gateway-secret
      AUTH_JWT_TTL: 5h
      STATE_SECRET: dev-state-secret
      ALLOWED_REDIRECTS: ${ALLOWED_REDIRECTS}
      ENABLE_HTTPS: "true"
      CERT_PATH: /app/certs
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/transcendence-ca.crt
    volumes:
      - ./certs/ca/ca.crt:/usr/local/share/ca-certificates/transcendence-ca.crt:ro

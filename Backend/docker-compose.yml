    depends_on:
      user_management:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get('https://localhost:3000/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s

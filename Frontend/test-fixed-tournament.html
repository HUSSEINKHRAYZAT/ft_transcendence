<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .test-button {
            background: #4a5568;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .test-button:hover {
            background: #2d3748;
        }
        .test-button.success {
            background: #48bb78;
        }
        .test-button.error {
            background: #f56565;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .success {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid #48bb78;
        }
        .error {
            background: rgba(245, 101, 101, 0.2);
            border: 1px solid #f56565;
        }
        .info {
            background: rgba(66, 153, 225, 0.2);
            border: 1px solid #4299e1;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e0;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a1a;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>🏆 Tournament System Fix Test</h1>
    <p>This page tests the fixed tournament creation and joining functionality.</p>

    <div class="test-section">
        <h2>🎯 Create Tournament Test</h2>
        <div class="input-group">
            <label for="tournament-name">Tournament Name:</label>
            <input type="text" id="tournament-name" value="Test Tournament" placeholder="Enter tournament name">
        </div>
        <div class="input-group">
            <label for="tournament-size">Tournament Size:</label>
            <select id="tournament-size">
                <option value="4">4 Players</option>
                <option value="8">8 Players</option>
                <option value="16">16 Players</option>
            </select>
        </div>
        <button class="test-button" onclick="testCreateTournament()">Create Tournament</button>
        <div id="create-result" class="test-result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h2>🎮 Join Tournament Test</h2>
        <div class="input-group">
            <label for="join-code">Tournament Code:</label>
            <input type="text" id="join-code" placeholder="Enter tournament code (from creation test above)">
        </div>
        <button class="test-button" onclick="testJoinTournament()">Join Tournament</button>
        <div id="join-result" class="test-result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h2>📋 Tournament List Test</h2>
        <button class="test-button" onclick="testListTournaments()">List All Tournaments</button>
        <div id="list-result" class="test-result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h2>🔧 System Status</h2>
        <button class="test-button" onclick="testSystemStatus()">Check Backend Availability</button>
        <div id="status-result" class="test-result" style="display: none;"></div>
    </div>

    <script type="module">
        // Import tournament service
        let tournamentService;
        
        // Mock user for testing
        window.mockUser = {
            id: 'test-user-123',
            name: 'Test Player',
            avatar: null
        };

        // Initialize tournament service
        async function initTournamentService() {
            try {
                const module = await import('./src/tournament/TournamentService.js');
                tournamentService = module.tournamentService;
                console.log('Tournament service initialized:', tournamentService);
                return tournamentService;
            } catch (error) {
                console.error('Failed to import tournament service:', error);
                throw error;
            }
        }

        // Test functions
        window.testCreateTournament = async function() {
            const resultDiv = document.getElementById('create-result');
            const button = event.target;
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'test-result info';
                resultDiv.textContent = 'Creating tournament...';
                button.disabled = true;

                if (!tournamentService) {
                    await initTournamentService();
                }

                const name = document.getElementById('tournament-name').value;
                const size = parseInt(document.getElementById('tournament-size').value);

                const tournament = await tournamentService.createTournament({
                    name: name,
                    size: size,
                    isPublic: true,
                    allowSpectators: true
                });

                resultDiv.className = 'test-result success';
                resultDiv.textContent = `✅ Tournament created successfully!
Tournament ID: ${tournament.tournamentId}
Name: ${tournament.name}
Size: ${tournament.size}
Players: ${tournament.players.length}/${tournament.size}
Status: ${tournament.status}

You can use Tournament ID "${tournament.tournamentId}" to test joining.`;

                // Auto-fill join code input
                document.getElementById('join-code').value = tournament.tournamentId;
                
                button.className = 'test-button success';
                button.textContent = '✅ Created Successfully';
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = `❌ Tournament creation failed:
${error.message}

Stack trace:
${error.stack}`;
                
                button.className = 'test-button error';
                button.textContent = '❌ Creation Failed';
            }
            
            button.disabled = false;
        };

        window.testJoinTournament = async function() {
            const resultDiv = document.getElementById('join-result');
            const button = event.target;
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'test-result info';
                resultDiv.textContent = 'Joining tournament...';
                button.disabled = true;

                if (!tournamentService) {
                    await initTournamentService();
                }

                const code = document.getElementById('join-code').value.trim();
                if (!code) {
                    throw new Error('Please enter a tournament code');
                }

                const tournament = await tournamentService.joinTournament({
                    tournamentId: code,
                    playerId: window.mockUser.id,
                    playerName: window.mockUser.name
                });

                resultDiv.className = 'test-result success';
                resultDiv.textContent = `✅ Tournament joined successfully!
Tournament: ${tournament.name}
Players: ${tournament.players.length}/${tournament.size}
Status: ${tournament.status}
Your player ID: ${window.mockUser.id}

Player list:
${tournament.players.map(p => `- ${p.name} (${p.isAI ? 'AI' : 'Human'})`).join('\n')}`;
                
                button.className = 'test-button success';
                button.textContent = '✅ Joined Successfully';
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = `❌ Tournament join failed:
${error.message}

Stack trace:
${error.stack}`;
                
                button.className = 'test-button error';
                button.textContent = '❌ Join Failed';
            }
            
            button.disabled = false;
        };

        window.testListTournaments = async function() {
            const resultDiv = document.getElementById('list-result');
            const button = event.target;
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'test-result info';
                resultDiv.textContent = 'Loading tournaments...';
                button.disabled = true;

                if (!tournamentService) {
                    await initTournamentService();
                }

                const tournaments = await tournamentService.listTournaments();

                resultDiv.className = 'test-result success';
                resultDiv.textContent = `✅ Found ${tournaments.length} tournaments:

${tournaments.length === 0 ? 'No tournaments found.' : 
  tournaments.map(t => `🏆 ${t.name}
   ID: ${t.id}
   Size: ${t.currentPlayers}/${t.size} players
   Status: ${t.status}`).join('\n\n')}`;
                
                button.className = 'test-button success';
                button.textContent = '✅ Listed Successfully';
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = `❌ Tournament list failed:
${error.message}

Stack trace:
${error.stack}`;
                
                button.className = 'test-button error';
                button.textContent = '❌ List Failed';
            }
            
            button.disabled = false;
        };

        window.testSystemStatus = async function() {
            const resultDiv = document.getElementById('status-result');
            const button = event.target;
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'test-result info';
                resultDiv.textContent = 'Checking system status...';
                button.disabled = true;

                if (!tournamentService) {
                    await initTournamentService();
                }

                // Check if backend is available
                const backendAvailable = await tournamentService.detectBackendAvailability();

                resultDiv.className = 'test-result info';
                resultDiv.textContent = `System Status Report:

Backend Available: ${backendAvailable ? '✅ Yes' : '❌ No (Using client-side fallback)'}
Tournament Service: ✅ Loaded
Mock User: ✅ ${window.mockUser.name} (${window.mockUser.id})
Client-side Storage: ✅ Available

${backendAvailable ? 
  'System is using backend tournament API.' :
  'System is using client-side tournament storage due to Docker containers using legacy schema.'}`;
                
                button.className = 'test-button success';
                button.textContent = '✅ Status Checked';
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = `❌ System status check failed:
${error.message}

Stack trace:
${error.stack}`;
                
                button.className = 'test-button error';
                button.textContent = '❌ Status Failed';
            }
            
            button.disabled = false;
        };

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Page loaded, initializing tournament service...');
            try {
                await initTournamentService();
                console.log('Tournament service ready for testing');
            } catch (error) {
                console.error('Failed to initialize tournament service:', error);
            }
        });
    </script>
</body>
</html>

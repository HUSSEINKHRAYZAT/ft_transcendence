<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End-to-End Tournament Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
        }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        .info { color: #60a5fa; }
        .warning { color: #fbbf24; }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-size: 14px;
        }
        button:hover {
            background: #6d28d9;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background: #374151;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            padding: 10px;
            background: #1f2937;
            border-radius: 5px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🏆 End-to-End Tournament Test</h1>
        <p>This page tests the complete tournament workflow from creation to execution.</p>
        
        <div class="status-bar">
            <div class="status-item">
                <span id="status-init">⏳</span>
                <span>Initialization</span>
            </div>
            <div class="status-item">
                <span id="status-create">⏳</span>
                <span>Tournament Creation</span>
            </div>
            <div class="status-item">
                <span id="status-join">⏳</span>
                <span>Player Joining</span>
            </div>
            <div class="status-item">
                <span id="status-ai">⏳</span>
                <span>AI Filling</span>
            </div>
            <div class="status-item">
                <span id="status-start">⏳</span>
                <span>Tournament Start</span>
            </div>
        </div>
        
        <div class="test-section">
            <h3>🚀 Quick Tests</h3>
            <button onclick="testTournamentSystem()">Run Full Tournament Test</button>
            <button onclick="testTournamentHub()">Test Tournament Hub</button>
            <button onclick="testMenuIntegration()">Test Menu Integration</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        
        <div class="test-section">
            <h3>🔧 Manual Tests</h3>
            <button onclick="createTournamentManually(4)">Create 4-Player Tournament</button>
            <button onclick="createTournamentManually(8)">Create 8-Player Tournament</button>
            <button onclick="createTournamentManually(16)">Create 16-Player Tournament</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script type="module">
        let tournamentService;
        let testResults = [];

        function updateStatus(step, status) {
            const element = document.getElementById(`status-${step}`);
            if (element) {
                element.textContent = status === 'success' ? '✅' : status === 'error' ? '❌' : '⏳';
            }
        }

        window.log = function(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            const logEntry = `[${timestamp}] ${message}`;
            testResults.push(`<span class="${className}">${logEntry}</span>`);
            updateResults();
            console.log(message);
        };

        function updateResults() {
            const results = document.getElementById('results');
            results.innerHTML = testResults.join('\n');
            results.scrollTop = results.scrollHeight;
        }

        window.clearResults = function() {
            testResults = [];
            updateResults();
            // Reset status indicators
            ['init', 'create', 'join', 'ai', 'start'].forEach(step => updateStatus(step, 'pending'));
        };

        // Initialize mock environment
        async function initializeMockEnvironment() {
            try {
                updateStatus('init', 'pending');
                log('🔧 Initializing mock environment...', 'info');
                
                // Mock user session
                window.authService = {
                    getState: () => ({
                        user: {
                            id: 'test-user-123',
                            firstName: 'TestUser',
                            userName: 'TestPlayer',
                            email: 'test@example.com'
                        }
                    })
                };

                // Mock overlay function
                window.overlay = function(content) {
                    const div = document.createElement('div');
                    div.innerHTML = content;
                    div.style.cssText = 'position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 24px; z-index: 9999; max-width: 90vw; max-height: 80vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);';
                    
                    div.remove = function() {
                        if (div.parentNode) {
                            div.parentNode.removeChild(div);
                        }
                    };
                    
                    document.body.appendChild(div);
                    log('📱 Overlay created with content', 'info');
                    return div;
                };

                // Mock require login
                window.requireLogin = function() {
                    return {
                        user: {
                            id: 'test-user-123',
                            name: 'Test Player'
                        }
                    };
                };

                // Import tournament service
                const { tournamentService: ts } = await import('./src/tournament/TournamentService.js');
                tournamentService = ts;
                
                log('✅ Mock environment initialized successfully', 'success');
                updateStatus('init', 'success');
                return true;
            } catch (error) {
                log(`❌ Failed to initialize: ${error.message}`, 'error');
                updateStatus('init', 'error');
                return false;
            }
        }

        window.testTournamentSystem = async function() {
            const initialized = await initializeMockEnvironment();
            if (!initialized) return;

            try {
                updateStatus('create', 'pending');
                log('🏆 Testing tournament creation...', 'info');
                
                const tournament = await tournamentService.createTournament({
                    name: 'Full Test Championship',
                    size: 8,
                    isPublic: true,
                    allowSpectators: true
                });
                
                log(`✅ Tournament created: ${tournament.tournamentId}`, 'success');
                updateStatus('create', 'success');

                // Test joining
                updateStatus('join', 'pending');
                log('👥 Testing player joining...', 'info');
                
                for (let i = 2; i <= 4; i++) {
                    const result = await tournamentService.joinTournament({
                        tournamentId: tournament.tournamentId,
                        playerId: `test-player-${i}`,
                        playerName: `Test Player ${i}`
                    });
                    log(`✅ Player ${i} joined (${result.players.length}/${result.size})`, 'success');
                }
                updateStatus('join', 'success');

                // Test AI filling
                updateStatus('ai', 'pending');
                log('🤖 Testing AI filling...', 'info');
                
                const filledTournament = await tournamentService.fillWithAI(tournament.tournamentId);
                log(`✅ AI filled tournament (${filledTournament.players.length}/${filledTournament.size})`, 'success');
                updateStatus('ai', 'success');

                // Test tournament start
                updateStatus('start', 'pending');
                log('🏁 Testing tournament start...', 'info');
                
                const startedTournament = await tournamentService.startTournament(tournament.tournamentId);
                log(`✅ Tournament started with ${startedTournament.matches.length} matches`, 'success');
                updateStatus('start', 'success');

                log('🎉 Full tournament test completed successfully!', 'success');
                
            } catch (error) {
                log(`❌ Tournament test failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        window.testTournamentHub = async function() {
            const initialized = await initializeMockEnvironment();
            if (!initialized) return;

            try {
                log('🏢 Testing tournament hub...', 'info');
                
                const { openTournamentHub } = await import('./src/menu/MenuActions.js');
                await openTournamentHub();
                
                log('✅ Tournament hub opened successfully!', 'success');
                
            } catch (error) {
                log(`❌ Tournament hub test failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        window.testMenuIntegration = async function() {
            const initialized = await initializeMockEnvironment();
            if (!initialized) return;

            try {
                log('📋 Testing menu integration...', 'info');
                
                // Set up a mock tournament size selector
                const mockSelector = document.createElement('select');
                mockSelector.id = 'tSize';
                mockSelector.innerHTML = `
                    <option value="4">4 Players</option>
                    <option value="8" selected>8 Players</option>
                    <option value="16">16 Players</option>
                `;
                document.body.appendChild(mockSelector);
                
                const { createTournament } = await import('./src/menu/MenuActions.js');
                await createTournament();
                
                log('✅ Menu integration test completed!', 'success');
                
                // Clean up
                document.body.removeChild(mockSelector);
                
            } catch (error) {
                log(`❌ Menu integration test failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        window.createTournamentManually = async function(size) {
            const initialized = await initializeMockEnvironment();
            if (!initialized) return;

            try {
                log(`🎯 Creating ${size}-player tournament manually...`, 'info');
                
                const tournament = await tournamentService.createTournament({
                    name: `Manual ${size}-Player Test`,
                    size: size,
                    isPublic: true,
                    allowSpectators: true
                });
                
                log(`✅ ${size}-player tournament created successfully!`, 'success');
                log(`📊 Details: ID=${tournament.tournamentId}, Players=${tournament.players.length}/${tournament.size}`, 'info');
                
                return tournament;
                
            } catch (error) {
                log(`❌ Failed to create ${size}-player tournament: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        // Auto-initialize on page load
        log('🏆 Tournament test page loaded. Click buttons to run tests!', 'info');
    </script>
</body>
</html>

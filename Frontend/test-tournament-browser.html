<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        .info { color: #60a5fa; }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #6d28d9;
        }
        #results {
            margin-top: 20px;
            padding: 10px;
            background: #374151;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🏆 Tournament System Test</h1>
        <p>This page tests the tournament creation functionality.</p>
        
        <div class="test-item">
            <h3>Test Tournament Creation</h3>
            <button onclick="testTournamentCreation()">Create Tournament</button>
            <button onclick="testJoinTournament()">Join Tournament</button>
            <button onclick="testOpenHub()">Open Tournament Hub</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script type="module">
        window.log = function(message, type = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            results.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            results.scrollTop = results.scrollHeight;
        };

        // Test tournament creation directly
        window.testTournamentCreation = async function() {
            try {
                log('🚀 Testing tournament creation...', 'info');
                
                // Mock a user session for testing
                window.authService = {
                    getState: () => ({
                        user: {
                            id: 'test-user-123',
                            firstName: 'Test',
                            userName: 'TestPlayer',
                            email: 'test@example.com'
                        }
                    })
                };

                // Import the tournament service
                const { tournamentService } = await import('./src/tournament/TournamentService.js');
                
                log('📋 Tournament service loaded', 'success');
                
                // Create a test tournament
                const tournament = await tournamentService.createTournament({
                    name: 'Test Championship',
                    size: 4,
                    isPublic: true,
                    allowSpectators: true
                });
                
                log('✅ Tournament created successfully!', 'success');
                log(`📊 Tournament ID: ${tournament.tournamentId}`, 'info');
                log(`📊 Tournament Name: ${tournament.name}`, 'info');
                log(`📊 Size: ${tournament.size}`, 'info');
                log(`📊 Players: ${tournament.players.length}`, 'info');
                log(`📊 Status: ${tournament.status}`, 'info');
                
                // Store the ID for joining test
                window.lastTournamentId = tournament.tournamentId;
                
            } catch (error) {
                log(`❌ Tournament creation failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        window.testJoinTournament = async function() {
            try {
                if (!window.lastTournamentId) {
                    log('⚠️ No tournament ID available. Create a tournament first.', 'error');
                    return;
                }

                log('🔗 Testing tournament joining...', 'info');
                
                const { tournamentService } = await import('./src/tournament/TournamentService.js');
                
                const updatedTournament = await tournamentService.joinTournament({
                    tournamentId: window.lastTournamentId,
                    playerId: 'test-player-2',
                    playerName: 'Test Player 2'
                });
                
                log('✅ Player joined successfully!', 'success');
                log(`👥 Player count: ${updatedTournament.players.length}`, 'info');
                
            } catch (error) {
                log(`❌ Join tournament failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        window.testOpenHub = async function() {
            try {
                log('🏢 Testing tournament hub...', 'info');
                
                // Mock overlay function
                window.overlay = function(content) {
                    const div = document.createElement('div');
                    div.innerHTML = content;
                    div.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 20px; z-index: 9999; max-width: 90vw; max-height: 90vh; overflow: auto;';
                    
                    div.remove = function() {
                        if (div.parentNode) {
                            div.parentNode.removeChild(div);
                        }
                    };
                    
                    document.body.appendChild(div);
                    return div;
                };

                // Mock require login
                window.requireLogin = function() {
                    return {
                        user: {
                            id: 'test-user-123',
                            name: 'Test Player'
                        }
                    };
                };

                const { openTournamentHub } = await import('./src/menu/MenuActions.js');
                await openTournamentHub();
                
                log('✅ Tournament hub opened!', 'success');
                
            } catch (error) {
                log(`❌ Tournament hub failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        log('🏆 Tournament test page loaded. Click buttons to test!', 'info');
    </script>
</body>
</html>

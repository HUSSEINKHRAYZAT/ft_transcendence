<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Confirm Dialog Preview</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: white;
        }
        
        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        
        h1 {
            color: #84cc16;
            margin-bottom: 10px;
        }
        
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        
        .demo-button {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(132, 204, 22, 0.5);
            background: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
            color: white;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .demo-button:hover {
            background: linear-gradient(135deg, #65a30d 0%, #4d7c0f 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(132, 204, 22, 0.3);
        }
        
        /* Dialog Styles */
        .confirm-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: fadeIn 0.2s ease-out;
        }
        
        .confirm-dialog-box {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 2px solid rgba(132, 204, 22, 0.3);
            border-radius: 16px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(132, 204, 22, 0.15);
            animation: slideIn 0.3s ease-out;
            overflow: hidden;
        }
        
        .dialog-header {
            background: linear-gradient(135deg, rgba(132, 204, 22, 0.15) 0%, rgba(132, 204, 22, 0.05) 100%);
            border-bottom: 1px solid rgba(132, 204, 22, 0.2);
            padding: 20px 24px;
        }
        
        .dialog-header h3 {
            margin: 0;
            color: #84cc16;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .dialog-content {
            padding: 24px;
            color: #e5e7eb;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .dialog-footer {
            padding: 20px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(132, 204, 22, 0.1);
        }
        
        .dialog-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .dialog-btn-cancel {
            border: 1px solid rgba(107, 114, 128, 0.5);
            background: rgba(55, 65, 81, 0.5);
            color: #d1d5db;
        }
        
        .dialog-btn-cancel:hover {
            background: rgba(75, 85, 99, 0.7);
            border-color: rgba(156, 163, 175, 0.5);
        }
        
        .dialog-btn-confirm {
            border: 1px solid rgba(132, 204, 22, 0.5);
            background: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
            color: white;
        }
        
        .dialog-btn-confirm:hover {
            background: linear-gradient(135deg, #65a30d 0%, #4d7c0f 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(132, 204, 22, 0.3);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .result {
            margin-top: 20px;
            padding: 16px;
            background: rgba(132, 204, 22, 0.1);
            border: 1px solid rgba(132, 204, 22, 0.3);
            border-radius: 8px;
            color: #84cc16;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🎨 Custom Confirm Dialog Preview</h1>
        <p>Click the buttons below to see the custom confirmation dialogs in action</p>
        
        <button class="demo-button" onclick="showDialog1()">
            Leave Tournament
        </button>
        
        <button class="demo-button" onclick="showDialog2()">
            Exit Game
        </button>
        
        <button class="demo-button" onclick="showDialog3()">
            Return to Menu
        </button>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        function showDialog(title, message, confirmText, cancelText) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'confirm-dialog-overlay';
                
                overlay.innerHTML = `
                    <div class="confirm-dialog-box">
                        <div class="dialog-header">
                            <h3>
                                <span style="font-size: 24px;">⚠️</span>
                                ${title}
                            </h3>
                        </div>
                        <div class="dialog-content">
                            ${message}
                        </div>
                        <div class="dialog-footer">
                            <button class="dialog-btn dialog-btn-cancel" onclick="handleDialogResponse(false)">
                                ${cancelText}
                            </button>
                            <button class="dialog-btn dialog-btn-confirm" onclick="handleDialogResponse(true)">
                                ${confirmText}
                            </button>
                        </div>
                    </div>
                `;
                
                window.currentDialogResolve = resolve;
                window.handleDialogResponse = (result) => {
                    overlay.remove();
                    resolve(result);
                    showResult(result);
                };
                
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        window.handleDialogResponse(false);
                    }
                });
                
                document.addEventListener('keydown', function handleEsc(e) {
                    if (e.key === 'Escape') {
                        window.handleDialogResponse(false);
                        document.removeEventListener('keydown', handleEsc);
                    }
                });
                
                document.body.appendChild(overlay);
            });
        }
        
        function showResult(result) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = result ? '✅ User clicked: Yes' : '❌ User clicked: No';
            resultDiv.className = 'result show';
            setTimeout(() => {
                resultDiv.className = 'result';
            }, 3000);
        }
        
        async function showDialog1() {
            await showDialog(
                'Leave Tournament',
                'Are you sure you want to leave this tournament?',
                'Yes, Leave',
                'Stay'
            );
        }
        
        async function showDialog2() {
            await showDialog(
                'Exit Game?',
                'This will end the match for all players.',
                'Yes, Exit',
                'Stay in Game'
            );
        }
        
        async function showDialog3() {
            await showDialog(
                'Leave Tournament Creation',
                'Return to main menu?',
                'Yes, Leave',
                'Stay Here'
            );
        }
    </script>
</body>
</html>
